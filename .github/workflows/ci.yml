name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: |
          dotnet tool restore
          dotnet restore WindowsAssetInventory.sln --locked-mode

      - name: Verify formatting
        run: dotnet format WindowsAssetInventory.sln --verify-no-changes --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list WindowsAssetInventory.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build WindowsAssetInventory.sln --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test WindowsAssetInventory.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Publish application
        run: >
          dotnet publish src/WindowsAssetInventory/WindowsAssetInventory.csproj
          --configuration Release
          --no-build
          --output artifacts/app

      - name: Upload test and application artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: windows-asset-inventory
          path: |
            artifacts/app
            TestResults
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build runtime image
        run: docker build --target runtime --tag windows-asset-inventory:ci .

      - name: Start container
        run: docker run --detach --name inventory-ci --publish 8080:8080 windows-asset-inventory:ci

      - name: Wait for healthy API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs inventory-ci
          exit 1

      - name: Verify seeded dashboard
        run: curl --fail --silent http://127.0.0.1:8080/api/dashboard | grep '"totalAssets":12'

      - name: Show logs on failure
        if: failure()
        run: docker logs inventory-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force inventory-ci || true
